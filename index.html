<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>電腦連機射擊 (模式獨立與自動重試版)</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            overscroll-behavior: none;
        }
        h1 { margin: 5px 0; font-size: 24px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .instructions { margin-bottom: 8px; font-size: 13px; color: #ccc; }
        .highlight-p1 { color: #4facf7; font-weight: bold; }
        .highlight-p2 { color: #ff6b6b; font-weight: bold; }
        
        .canvas-container { position: relative; max-width: 800px; margin: 0 auto; }
        canvas {
            background-color: #0d0d0d; border: 4px solid #333; border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8); width: 100%; height: auto; display: block; margin: 0 auto;
        }

        #startMenu, #gameOverMenu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 13, 13, 0.96); display: flex; flex-direction: column;
            justify-content: center; align-items: center; border-radius: 8px; z-index: 10;
            backdrop-filter: blur(5px); padding: 15px; box-sizing: border-box;
        }
        #gameOverMenu { display: none; z-index: 12; }
        #startMenu h2 { font-size: 20px; margin-bottom: 8px; color: #fff; }
        
        .menu-top-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
        .menu-option-group { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); padding: 8px 12px; border-radius: 8px; }
        .menu-option-group label { font-size: 12px; color: #aaa; display: block; margin-bottom: 4px; }
        
        .menu-selectors { display: flex; gap: 15px; margin-bottom: 12px; flex-wrap: wrap; justify-content: center; }
        .menu-player-box { background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 10px; width: 210px; box-sizing: border-box; }
        .menu-player-box h3 { margin: 0 0 6px 0; font-size: 14px; }
        
        .menu-single-box { background: rgba(255, 255, 255, 0.05); border: 2px solid #ffeb3b; border-radius: 10px; padding: 10px; width: 280px; box-sizing: border-box; }
        .menu-single-box h3 { margin: 0 0 6px 0; font-size: 14px; color: #ffeb3b; }

        .mode-buttons-container { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
        .mode-choice-btn {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
            color: #ccc; padding: 5px; font-size: 11px; border-radius: 5px; cursor: pointer; text-align: left;
            display: flex; justify-content: space-between; align-items: center; transition: all 0.2s;
        }
        .mode-choice-btn.active { background: #4facf7; color: #fff; border-color: #fff; font-weight: bold; }
        .p2-box .mode-choice-btn.active { background: #ff6b6b; }
        .menu-single-box .mode-choice-btn.active { background: #ffeb3b; color: #000; border-color: #fff; }
        
        .start-action-btn {
            background: linear-gradient(135deg, #28a745, #218838); color: #fff; border: 2px solid #57d172;
            padding: 8px 25px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer;
            transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-top: 5px;
        }
        .start-action-btn:hover { transform: translateY(-2px); }
        .menu-btn-choice { background: #333; color: #fff; border: 1px solid #555; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; margin: 2px; }
        .menu-btn-choice.active { background: #4facf7; border-color: #fff; }

        #onlineConfigPanel {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px; border-radius: 8px; margin-bottom: 10px; width: 100%; max-width: 440px; box-sizing: border-box;
        }
        .quick-match-btn {
            background: linear-gradient(135deg, #007bff, #0056b3); color: #fff; border: 2px solid #4facf7;
            padding: 10px 20px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,123,255,0.4); width: 100%; transition: all 0.2s;
        }
        .quick-match-btn:active { transform: scale(0.98); }
        .cancel-match-btn { background: #6c757d; border-color: #5a6268; margin-top: 8px; padding: 6px 12px; font-size: 13px; border-radius: 6px; color: #fff; cursor: pointer;}

        .mobile-controls { display: flex; justify-content: space-around; max-width: 800px; margin: 10px auto 0 auto; gap: 10px; }
        .player-control-group { flex: 1; background: rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 8px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .control-row { display: flex; justify-content: center; gap: 5px; margin-bottom: 5px; }
        .ctrl-btn { background-color: #333; color: #fff; border: 2px solid #555; border-radius: 8px; font-size: 14px; font-weight: bold; padding: 10px 0; width: 45px; height: 45px; cursor: pointer; }
        .ctrl-btn.active { background-color: #666; transform: scale(0.95); }
        .wide-btn { width: 100px; font-size: 12px; height: 40px; }
        .p1-panel h4 { margin: 0 0 5px 0; color: #4facf7; font-size: 12px; }
        .p2-panel h4 { margin: 0 0 5px 0; color: #ff6b6b; font-size: 12px; }
        .p1-panel .ctrl-btn.active { background-color: #4facf7; border-color: #fff; }
        .p2-panel .ctrl-btn.active { background-color: #ff6b6b; border-color: #fff; }

        .global-controls { margin-top: 8px; display: flex; justify-content: center; gap: 10px; }
        .restart-btn { background-color: #444; color: #fff; border: 2px solid #777; padding: 8px 20px; border-radius: 6px; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>電腦連機射擊</h1>
    <div class="instructions" id="instructionText">
        <span class="highlight-p1">玩家1</span>: W,A,S,D 移動 | 空白鍵發射 &nbsp;|&nbsp; <span class="highlight-p2">玩家2</span>: 方向鍵移動 | Enter 發射
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div id="startMenu">
            <h2>對戰設定與模式選擇</h2>
            <div class="menu-top-row">
                <div class="menu-option-group">
                    <label>對戰類型</label>
                    <button class="menu-btn-choice active" id="modeLocalBtn" onclick="setGameType('local')">本地雙人</button>
                    <button class="menu-btn-choice" id="modeOnlineNormalBtn" onclick="setGameType('online_normal')">線上普通對戰</button>
                    <button class="menu-btn-choice" id="modeOnlineSpecialBtn" onclick="setGameType('online_special')">線上特殊對戰</button>
                </div>
            </div>

            <button class="start-action-btn" id="startBtn" onclick="startGame()">開始本地對戰</button>

            <div id="onlineConfigPanel" style="display: none;">
                <div id="onlineModeHint" style="font-size: 12px; color: #ccc; margin-bottom: 8px;">【線上模式】每5秒自動重新偵測匹配</div>
                
                <div id="matchBtnContainer">
                    <button class="quick-match-btn" onclick="startMatchmaking()">尋找對手 (自動匹配)</button>
                </div>

                <div id="matchStatusContainer" style="display: none;">
                    <div id="matchStatusText" style="color: #00ffcc; font-size: 14px; font-weight: bold;">正在尋找同模式玩家...</div>
                    <div id="matchStatusSub" style="color: #aaa; font-size: 11px; margin-top: 3px;">搜尋中 0s (每5秒重新偵測)</div>
                    <button class="cancel-match-btn" onclick="cancelMatchmaking()">取消匹配</button>
                </div>
            </div>

            <!-- 本地雙人的雙選單 -->
            <div class="menu-selectors" id="menuSelectorsContainer" style="margin-top: 8px;">
                <div class="menu-player-box" style="border-color: #4facf7;">
                    <h3 style="color: #4facf7;" id="p1BoxTitle">玩家 1 (藍)</h3>
                    <div class="mode-buttons-container" id="p1ModeContainer">
                        <button class="mode-choice-btn active" onclick="selectModeDirect(1, 0)">標準模式 <span>標準冷卻/傷害</span></button>
                        <button class="mode-choice-btn" onclick="selectModeDirect(1, 1)">2倍速連發 <span>移動更快、子彈小</span></button>
                        <button class="mode-choice-btn" onclick="selectModeDirect(1, 2)">蓄力模式 <span>按住集氣大彈波</span></button>
                    </div>
                </div>
                <div class="menu-player-box p2-box" id="p2MenuBox" style="border-color: #ff6b6b;">
                    <h3 id="p2BoxTitle" style="color: #ff6b6b;">玩家 2 (紅)</h3>
                    <div class="mode-buttons-container" id="p2ModeContainer">
                        <button class="mode-choice-btn active" onclick="selectModeDirect(2, 0)">標準模式 <span>標準冷卻/傷害</span></button>
                        <button class="mode-choice-btn" onclick="selectModeDirect(2, 1)">2倍速連發 <span>移動更快、子彈小</span></button>
                        <button class="mode-choice-btn" onclick="selectModeDirect(2, 2)">蓄力模式 <span>按住集氣大彈波</span></button>
                    </div>
                </div>
            </div>

            <!-- 線上特殊對戰的單一黃色選單 -->
            <div class="menu-selectors" id="onlineSpecialSelectorContainer" style="display: none; margin-top: 8px;">
                <div class="menu-single-box">
                    <h3>您的模式選擇</h3>
                    <div class="mode-buttons-container" id="singleModeContainer">
                        <button class="mode-choice-btn active" onclick="selectSingleMode(0)">標準模式 <span>標準冷卻/傷害</span></button>
                        <button class="mode-choice-btn" onclick="selectSingleMode(1)">2倍速連發 <span>移動更快、子彈小</span></button>
                        <button class="mode-choice-btn" onclick="selectSingleMode(2)">蓄力模式 <span>按住集氣大彈波</span></button>
                    </div>
                </div>
            </div>

            <div id="menuModeHintText" style="font-size: 11px; color: #aaa;">提示：可直接點擊按鈕，或用 A/D 與 ←/→ 切換模式</div>
        </div>

        <div id="gameOverMenu">
            <h2 id="gameOverTitleText" style="font-size: 28px; margin-bottom: 10px; color: #ff5252;">遊戲結束</h2>
            <div id="gameOverStatusText" style="font-size: 15px; color: #ffeb3b; margin-bottom: 18px; padding: 0 20px;">請選擇下一步操作</div>
            <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;" id="gameOverButtonContainer">
                <button class="start-action-btn" id="rematchActionBtn" onclick="handleRematchClick()">再來一局 (原班人馬)</button>
                <button class="restart-btn" style="background-color: #d9534f; border-color: #d43f3a;" onclick="returnToMenu()">返回選單</button>
            </div>
        </div>
    </div>

    <!-- 觸控控制 -->
    <div class="mobile-controls">
        <div class="player-control-group p1-panel">
            <h4 id="p1Title">玩家 1</h4>
            <div class="control-row"><button class="ctrl-btn" data-key="KeyW">W</button></div>
            <div class="control-row">
                <button class="ctrl-btn" data-key="KeyA">A</button>
                <button class="ctrl-btn" data-key="KeyS">S</button>
                <button class="ctrl-btn" data-key="KeyD">D</button>
            </div>
            <div class="control-row"><button class="ctrl-btn wide-btn" data-key="Space">發射 (Space)</button></div>
        </div>
        <div class="player-control-group p2-panel">
            <h4 id="p2Title">玩家 2</h4>
            <div class="control-row"><button class="ctrl-btn" data-key="ArrowUp">▲</button></div>
            <div class="control-row">
                <button class="ctrl-btn" data-key="ArrowLeft">◀</button>
                <button class="ctrl-btn" data-key="ArrowDown">▼</button>
                <button class="ctrl-btn" data-key="ArrowRight">▶</button>
            </div>
            <div class="control-row"><button class="ctrl-btn wide-btn" data-key="Enter">發射 (Enter)</button></div>
        </div>
    </div>
    <div class="global-controls"><button class="restart-btn" onclick="returnToMenu()">返回選單</button></div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Web Audio API 音效系統初始化
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type, param) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'normal_shoot') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'rapid_shoot') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.exponentialRampToValueAtTime(250, now + 0.04);
                    gain.gain.setValueAtTime(0.015, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    osc.start(now);
                    osc.stop(now + 0.04);
                } else if (type === 'charge_tier') {
                    osc.type = 'triangle';
                    const freq = 200 + (param || 1) * 120;
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'charge_shoot') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(250, now);
                    osc.frequency.exponentialRampToValueAtTime(60, now + 0.3);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'metal_clash') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'hit') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'death') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(280, now);
                    osc.frequency.linearRampToValueAtTime(120, now + 0.2);
                    osc.frequency.linearRampToValueAtTime(50, now + 0.4);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'heal') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.setValueAtTime(500, now + 0.1);
                    osc.frequency.setValueAtTime(700, now + 0.2);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch (e) {
                // 忽略音效異常
            }
        }

        const keys = {};
        const availableModes = [
            { id: 'normal', name: '標準模式' },
            { id: 'rapid', name: '2倍速連發' },
            { id: 'charge', name: '蓄力模式' }
        ];

        let p1ModeIndex = 0; 
        let p2ModeIndex = 0;
        let myModeIndex = 0; 
        let gameType = 'local'; 
        
        let peer = null; 
        let searchPeer = null; 
        let conn = null;
        let isHost = false;
        
        let matchTimerInterval = null;
        let matchRetryInterval = null;
        let matchSeconds = 0;

        let gameRound = 1; let clientRound = 1;
        let rematchState = 'none';
        
        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        };

        function setGameType(type) {
            initAudio();
            // 切換模式時自動取消並斷開所有先前的線上連線與匹配
            cancelMatchmaking();
            
            gameType = type;
            document.getElementById("modeLocalBtn").classList.toggle('active', type === 'local');
            document.getElementById("modeOnlineNormalBtn").classList.toggle('active', type === 'online_normal');
            document.getElementById("modeOnlineSpecialBtn").classList.toggle('active', type === 'online_special');
            
            const menuSelectors = document.getElementById("menuSelectorsContainer");
            const onlineSpecialSelector = document.getElementById("onlineSpecialSelectorContainer");
            const menuHintText = document.getElementById("menuModeHintText");

            if (type === 'online_normal') {
                document.getElementById("onlineConfigPanel").style.display = "block";
                document.getElementById("startBtn").style.display = "none";
                document.getElementById("onlineModeHint").innerText = "【普通對戰】雙方強制鎖定標準模式（每5秒自動偵測匹配）";
                p1ModeIndex = 0; p2ModeIndex = 0;
                menuSelectors.style.display = "none"; 
                onlineSpecialSelector.style.display = "none";
                menuHintText.style.display = "none";  
                updateMenuDisplay();
            } else if (type === 'online_special') {
                document.getElementById("onlineConfigPanel").style.display = "block";
                document.getElementById("startBtn").style.display = "none";
                document.getElementById("onlineModeHint").innerText = "【特殊對戰】選擇您的模式後即可開始匹配（每5秒自動偵測匹配）";
                menuSelectors.style.display = "none"; 
                onlineSpecialSelector.style.display = "flex"; 
                menuHintText.style.display = "block"; 
                document.getElementById("menuModeHintText").innerText = "提示：點擊上方黃色選單可選擇您想使用的特殊模式";
                updateSingleModeDisplay();
            } else {
                document.getElementById("onlineConfigPanel").style.display = "none";
                document.getElementById("startBtn").style.display = "inline-block";
                menuSelectors.style.display = "flex"; 
                onlineSpecialSelector.style.display = "none";
                menuHintText.style.display = "block"; 
                document.getElementById("menuModeHintText").innerText = "提示：可直接點擊按鈕，或用 A/D 與 ←/→ 切換模式";
            }
            updateMenuLabels();
        }

        function updateMenuLabels() {
            const p1Title = document.getElementById("p1BoxTitle");
            const p2Title = document.getElementById("p2BoxTitle");

            if (gameType.startsWith('online')) {
                if (conn && conn.open) { 
                    p1Title.innerHTML = isHost ? "玩家 1 <span style='color:#00ffcc'>(你)</span>" : "玩家 1 <span style='color:#ff5252'>(對手)</span>";
                    p2Title.innerHTML = !isHost ? "玩家 2 <span style='color:#00ffcc'>(你)</span>" : "玩家 2 <span style='color:#ff5252'>(對手)</span>";
                } else {
                    p1Title.innerHTML = "玩家 1 (藍)"; p2Title.innerHTML = "玩家 2 (紅)";
                }
            } else {
                p1Title.innerHTML = "玩家 1 (藍)"; p2Title.innerHTML = "玩家 2 (紅)";
            }
        }

        function updateMenuDisplay() {
            const p1Btns = document.querySelectorAll("#p1ModeContainer .mode-choice-btn");
            p1Btns.forEach((btn, idx) => btn.classList.toggle('active', idx === p1ModeIndex));

            const p2Btns = document.querySelectorAll("#p2ModeContainer .mode-choice-btn");
            p2Btns.forEach((btn, idx) => btn.classList.toggle('active', idx === p2ModeIndex));
        }

        function updateSingleModeDisplay() {
            const btns = document.querySelectorAll("#singleModeContainer .mode-choice-btn");
            btns.forEach((btn, idx) => btn.classList.toggle('active', idx === myModeIndex));
        }

        function selectModeDirect(playerNum, modeIdx) {
            initAudio();
            if (gameStarted || gameType !== 'local') return;

            if (playerNum === 1) {
                p1ModeIndex = modeIdx;
            } else {
                p2ModeIndex = modeIdx;
            }
            updateMenuDisplay();
        }

        function selectSingleMode(modeIdx) {
            initAudio();
            if (gameStarted || gameType !== 'online_special') return;
            myModeIndex = modeIdx;
            updateSingleModeDisplay();

            if (conn && conn.open) {
                if (isHost) {
                    p1ModeIndex = myModeIndex;
                    conn.send({ type: 'MODE_SYNC', p1Mode: p1ModeIndex });
                } else {
                    p2ModeIndex = myModeIndex;
                    conn.send({ type: 'MODE_SYNC', p2Mode: p2ModeIndex });
                }
            }
        }

        function cleanupPeers() {
            if (conn) { conn.close(); conn = null; }
            if (peer) { peer.destroy(); peer = null; }
            if (searchPeer) { searchPeer.destroy(); searchPeer = null; }
            isHost = false;
        }

        function cancelMatchmaking() {
            if (matchTimerInterval) clearInterval(matchTimerInterval);
            if (matchRetryInterval) clearInterval(matchRetryInterval);
            cleanupPeers();
            document.getElementById("matchBtnContainer").style.display = "block";
            document.getElementById("matchStatusContainer").style.display = "none";
        }

        function startMatchmakingFromGameOver() {
            document.getElementById("gameOverMenu").style.display = "none";
            document.getElementById("startMenu").style.display = "flex";
            startMatchmaking();
        }

        function startMatchmaking() {
            initAudio();
            cleanupPeers();
            document.getElementById("matchBtnContainer").style.display = "none";
            document.getElementById("matchStatusContainer").style.display = "block";
            document.getElementById("matchStatusText").innerText = "正在尋找對手...";
            document.getElementById("matchStatusText").style.color = "#00ffcc";
            
            matchSeconds = 0;
            document.getElementById("matchStatusSub").innerText = `搜尋中 ${matchSeconds}s (每5秒重新偵測)`;
            
            if (matchTimerInterval) clearInterval(matchTimerInterval);
            if (matchRetryInterval) clearInterval(matchRetryInterval);

            matchTimerInterval = setInterval(() => {
                matchSeconds++;

                if (matchSeconds === 5 && !conn) {
                    document.getElementById("matchStatusText").innerText = "目前無人排隊，已成為佇列首位";
                    document.getElementById("matchStatusText").style.color = "#ffeb3b";
                }
            }, 1000);

            // 首次嘗試匹配
            runMatchmakingAttempt();

            // 每 5 秒自動重新偵測/重新發起匹配
            matchRetryInterval = setInterval(() => {
                if (!conn) {
                    if (searchPeer) {
                        searchPeer.destroy();
                        searchPeer = null;
                    }
                    runMatchmakingAttempt();
                }
            }, 5000);
        }

        function runMatchmakingAttempt() {
            const queueId = "tw_shooter_queue_2026_" + gameType;
            searchPeer = new Peer(peerConfig);
            
            searchPeer.on('open', (id) => {
                let tempConn = searchPeer.connect(queueId);
                
                tempConn.on('open', () => {
                    tempConn.on('data', (data) => {
                        if (data.type === 'MATCH_SUCCESS' && data.roomId) {
                            if (matchRetryInterval) clearInterval(matchRetryInterval);
                            searchPeer.destroy();
                            joinPrivateGameRoom(data.roomId);
                        }
                    });
                });

                tempConn.on('error', () => { fallbackToQueueHost(queueId); });
            });

            searchPeer.on('error', (err) => {
                if (err.type === 'peer-unavailable') fallbackToQueueHost(queueId);
            });
        }

        function fallbackToQueueHost(queueId) {
            if (searchPeer) searchPeer.destroy();
            searchPeer = new Peer(queueId, peerConfig);
            
            searchPeer.on('open', () => {});

            searchPeer.on('connection', (tempConn) => {
                if (matchTimerInterval) clearInterval(matchTimerInterval);
                if (matchRetryInterval) clearInterval(matchRetryInterval);
                document.getElementById("matchStatusText").innerText = "找到對手！正在建立專屬通道...";
                document.getElementById("matchStatusSub").innerText = "請稍候...";

                const privateRoomId = "tw_shooter_room_" + Math.floor(Math.random() * 9999999);
                
                peer = new Peer(privateRoomId, peerConfig);
                peer.on('open', () => {
                    isHost = true;
                    if (gameType === 'online_special') p1ModeIndex = myModeIndex;
                    updateMenuLabels();
                    tempConn.send({ type: 'MATCH_SUCCESS', roomId: privateRoomId });
                    setTimeout(() => { if (searchPeer) { searchPeer.destroy(); searchPeer = null; } }, 1500);
                });

                peer.on('connection', (connection) => {
                    conn = connection;
                    setupGameConnectionEvents();
                    startHostCountdown();
                });
            });

            searchPeer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    // 衝突時等待下一次 5 秒循環自動重新偵測
                }
            });
        }

                    if (conn && conn.open) conn.send({ type: 'COUNTDOWN', count: count, p1Mode: p1ModeIndex, p2Mode: p2ModeIndex });
                    count--;

        function setupGameConnectionEvents() {
            conn.on('open', () => {
                if (!isHost) {
                    document.getElementById("matchStatusText").innerText = `通道連接成功，等待主機開始...`;
                    document.getElementById("matchStatusSub").innerText = "";
                    if (gameType === 'online_special') {
                        p2ModeIndex = myModeIndex;
                        conn.send({ type: 'MODE_SYNC', p2Mode: p2ModeIndex });
                    }
                } else {
                    if (gameType === 'online_special') {
                        p1ModeIndex = myModeIndex;
                        conn.send({ type: 'MODE_SYNC', p1Mode: p1ModeIndex, p2Mode: p2ModeIndex });
                    }
                }
            });

            conn.on('data', (data) => {
                if (data.type === 'MODE_SYNC') {
                    if (gameType === 'online_special') {
                        if (isHost && data.p2Mode !== undefined) p2ModeIndex = data.p2Mode;
                        if (!isHost && data.p1Mode !== undefined) p1ModeIndex = data.p1Mode;
                    }
                }

                if (data.type === 'REMATCH_REQ') {
                    rematchState = 'received'; updateGameOverUI();
                } else if (data.type === 'REMATCH_ACCEPT') {
                    triggerRematch(); 
                } else if (data.type === 'REMATCH_DECLINE') {
                    rematchState = 'declined_by_other'; updateGameOverUI();
                }

                if (isHost) {
                    if (data.type === 'KEYS') clientKeys = data.keys;
                } else {
                    if (data.type === 'COUNTDOWN') {
                        if (gameType === 'online_special') { 
                            p1ModeIndex = data.p1Mode; 
                            p2ModeIndex = myModeIndex; 
                            if (conn && conn.open) conn.send({ type: 'MODE_SYNC', p2Mode: p2ModeIndex });
                        }
                        document.getElementById("matchStatusText").innerText = `準備完畢！${data.count} 秒後開始...`;
                    } else if (data.type === 'START') {
                        if (gameType === 'online_special') { 
                            p1ModeIndex = data.p1Mode; 
                            p2ModeIndex = myModeIndex; 
                        }
                        startOnlineGameClient();
                    } else if (data.type === 'STATE') {
                        syncGameState = data;
                    }
                }
            });

            conn.on('close', () => {
                if (gameStarted || rematchState !== 'none') {
                    alert("對方已離開房間！");
                    returnToMenu();
                }
            });
        }

            update(opponent, inputKeys) {
                if (opponent) this.facingRight = opponent.x >= this.x;
                let currentSpeedMult = this.baseSpeedMultiplier; let chargeRate = 1.5;
                if (this.type === "charge") {
                    const bW = 14 + this.chargeLevel * 0.6;

                    const currentArea = bW * bH;
                    let calculatedDamage = 5 * (currentArea / standardArea);
                    if (calculatedDamage > 90) calculatedDamage = 90;

                    if (calculatedDamage >= 75) {

            ctx.lineTo(cx + total, cy + arm); ctx.lineTo(cx + arm, cy + arm); ctx.lineTo(cx + arm, cy + total); ctx.lineTo(cx - arm, cy + total);
            ctx.lineTo(cx - arm, cy + arm); ctx.lineTo(cx - total, cy + arm); ctx.lineTo(cx - total, cy - arm); ctx.lineTo(cx - arm, cy - arm);
            ctx.closePath(); ctx.strokeStyle = '#00ff00'; ctx.lineWidth = 3; ctx.stroke(); ctx.fillStyle = 'rgba(0, 255, 0, 0.15)'; ctx.fill(); ctx.restore();
        }

        function updateGameLogic() {
            if (!gameStarted) return;

            if (gameType === 'local' || (gameType.startsWith('online') && isHost)) {
                let p2Input = gameType.startsWith('online') ? clientKeys : keys;
                if (!gameOver && player1 && player2) {
                    player1.update(player2, keys); 
                    player2.update(player1, p2Input);
                    
                    if (healthPack) {
                        let hpBox = { x: healthPack.x - 16, y: healthPack.y - 16, width: 32, height: 32 };
                        if (checkCollision(player1, hpBox)) { 
                            player1.hp = Math.min(100, player1.hp + 50); 
                            createHitParticles(healthPack.x, healthPack.y, '#00ff00'); 
                            playSound('heal');
                            healthPack = null; 
                        } 
                        else if (checkCollision(player2, hpBox)) { 
                            player2.hp = Math.min(100, player2.hp + 50); 
                            createHitParticles(healthPack.x, healthPack.y, '#00ff00'); 
                            playSound('heal');
                            healthPack = null; 
                        }
                    }

                    let bulletsToRemove = new Set();
                    for (let i = 0; i < bullets.length; i++) { 
                        bullets[i].x += bullets[i].speed; 
                        if (bullets[i].x < -100 || bullets[i].x > canvas.width + 100) bulletsToRemove.add(i); 
                    }
                    for (let i = 0; i < bullets.length; i++) {
                        if (bulletsToRemove.has(i)) continue; let b1 = bullets[i];
                        for (let j = i + 1; j < bullets.length; j++) {
                            if (bulletsToRemove.has(j)) continue; let b2 = bullets[j];
                            if (b1.owner !== b2.owner && checkCollision(b1, b2)) {
                                playSound('metal_clash');
                                if (Math.abs(b1.damage - b2.damage) < 0.01) { bulletsToRemove.add(i); bulletsToRemove.add(j); createHitParticles((b1.x + b2.x)/2, (b1.y + b2.y)/2, '#ffeb3b'); } 
                                else if (b1.damage > b2.damage) { let ratio = (b1.damage - b2.damage) / b1.damage; b1.y += (b1.height - b1.height*ratio)/2; b1.width *= ratio; b1.height *= ratio; bulletsToRemove.add(j); createHitParticles(b2.x, b2.y + b2.height/2, b2.color); } 
                                else { let ratio = (b2.damage - b1.damage) / b2.damage; b2.damage -= b1.damage; b2.y += (b2.height - b2.height*ratio)/2; b2.width *= ratio; b2.height *= ratio; bulletsToRemove.add(i); createHitParticles(b1.x, b1.y + b1.height/2, b1.color); }
                            }
                        }
                    }

                    for (let i = 0; i < bullets.length; i++) {
                        if (bulletsToRemove.has(i)) continue; let b = bullets[i]; let target = b.owner === 1 ? player2 : player1;
                        if (checkCollision(b, target)) {
                            target.hp -= b.damage; 
                            createHitParticles(b.x, b.y + b.height / 2, target.color); 
                            playSound('hit');
                            bulletsToRemove.add(i);
                            if (target.hp <= 0) {
                                playSound('death');
                                showGameOver(`${target === player1 ? "玩家 1 (藍)" : "玩家 2 (紅)"} 輸了！`);
                            }
                        }
                    }
                    Array.from(bulletsToRemove).sort((a, b) => b - a).forEach(idx => bullets.splice(idx, 1));
                }
                if (gameType.startsWith('online') && conn && conn.open) {
                    conn.send({ type: 'STATE', p1: player1 ? { x: player1.x, y: player1.y, hp: player1.hp, facingRight: player1.facingRight, chargeLevel: player1.chargeLevel } : null, p2: player2 ? { x: player2.x, y: player2.y, hp: player2.hp, facingRight: player2.facingRight, chargeLevel: player2.chargeLevel } : null, bullets: bullets, healthPack: healthPack, gameOver: gameOver, winnerMessage: winnerMessage, round: gameRound });
                }
            } else if (gameType.startsWith('online') && !isHost) {
                if (conn && conn.open) conn.send({ type: 'KEYS', keys: keys });
                if (!gameOver && player2) player2.update(player1, keys);
                
                if (syncGameState) {
                    if (syncGameState.round > clientRound) { 
                        clientRound = syncGameState.round; 
                        gameRound = clientRound; 
                        triggerRematch(); 
                    }
                    if (player1 && syncGameState.p1) {
                        player1.x += (syncGameState.p1.x - player1.x) * 0.4;
                        player1.y += (syncGameState.p1.y - player1.y) * 0.4;
                        player1.hp = syncGameState.p1.hp; player1.facingRight = syncGameState.p1.facingRight; player1.chargeLevel = syncGameState.p1.chargeLevel;
                    }
                    if (player2 && syncGameState.p2) {
                        player2.x += (syncGameState.p2.x - player2.x) * 0.2;
                        player2.y += (syncGameState.p2.y - player2.y) * 0.2;
                        player2.hp = syncGameState.p2.hp; player2.facingRight = syncGameState.p2.facingRight; player2.chargeLevel = syncGameState.p2.chargeLevel;
                    }
                    bullets = syncGameState.bullets || []; 
                    healthPack = syncGameState.healthPack;
                    if (syncGameState.gameOver && !gameOver && syncGameState.round === clientRound) showGameOver(syncGameState.winnerMessage);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }
        }

        let lastTimestamp = 0;
        let accumulator = 0;
        const timeStep = 1000 / 60;

        function gameLoop(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            let dt = timestamp - lastTimestamp;
            lastTimestamp = timestamp;
            if (dt > 200) dt = 200;

            accumulator += dt;
            while (accumulator >= timeStep) {
                updateGameLogic();
                accumulator -= timeStep;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawHealthPack();
            for (let i = 0; i < bullets.length; i++) { 
                ctx.save(); 
                ctx.shadowColor = bullets[i].color; 
                ctx.shadowBlur = 8; 
                ctx.fillStyle = bullets[i].color; 
                ctx.fillRect(bullets[i].x, bullets[i].y, bullets[i].width, bullets[i].height); 
                ctx.restore(); 
            }
            for (let i = 0; i < particles.length; i++) { 
                particles[i].draw(); 
            }
            if (gameStarted && player1 && player2) { 
                player1.draw(); 
                player2.draw(); 
            }

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
